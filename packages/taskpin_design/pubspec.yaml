name: taskpin_design
description: >-
  TaskPin design system (Windows 11 native): a three-layer token system
  (primitives -> semantic -> component) plus a platform-free Flutter
  component library. Contains no MethodChannel, no FFI and no native code.
version: 0.1.0
publish_to: none

environment:
  # 3.27 is the floor for `Color.withValues` / `Color.toARGB32`, which this
  # package uses instead of the deprecated `Color.value` / `withOpacity`.
  # The plan installs current stable, which is well past this.
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  # Fonts land here once the Inter / JetBrains Mono TTFs are vendored into
  # `fonts/` (Phase 0 or Phase 12 owns that decision — it is a package-size
  # question, see the "体积预算" open item in docs/FLUTTER_REWRITE_PLAN.md).
  # Until then the typography tokens still name 'Inter' and 'JetBrains Mono'
  # and Flutter falls back to the platform default, so the gallery renders.
  #
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: fonts/Inter-Regular.ttf
  #         weight: 400
  #       - asset: fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: fonts/Inter-Bold.ttf
  #         weight: 700
  #   - family: JetBrains Mono
  #     fonts:
  #       - asset: fonts/JetBrainsMono-Regular.ttf
  #         weight: 400
  #       - asset: fonts/JetBrainsMono-Medium.ttf
  #         weight: 500
