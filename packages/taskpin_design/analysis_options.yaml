include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # The design system is consumed by app code; keep its public surface
    # explicit and documented.
    public_member_api_docs: false
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_final_locals: true
    always_declare_return_types: true
    avoid_print: true
    sort_constructors_first: false
    use_super_parameters: true

analyzer:
  language:
    strict-casts: true
    strict-inference: true
  errors:
    # Colour literals are only legal under lib/src/tokens/ — enforced by
    # test/no_raw_colors_test.dart. Keep the analyzer quiet about the ones
    # that legitimately live there.
    todo: ignore
  exclude:
    - build/**
