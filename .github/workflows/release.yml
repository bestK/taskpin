name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -c release

      - name: Sign and Package
        run: |
          VERSION=$(cat version.txt)
          codesign --force --deep -s - .build/release/TaskPin
          mkdir -p dist/TaskPin.app/Contents/MacOS
          mkdir -p dist/TaskPin.app/Contents/Resources
          cp .build/release/TaskPin dist/TaskPin.app/Contents/MacOS/
          cp -r examples dist/
          if [ -f src/macos/Resources/AppIcon.icns ]; then
            cp src/macos/Resources/AppIcon.icns dist/TaskPin.app/Contents/Resources/
          fi
          cat > dist/TaskPin.app/Contents/Info.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>TaskPin</string>
            <key>CFBundleIdentifier</key>
            <string>com.bestk.taskpin</string>
            <key>CFBundleName</key>
            <string>TaskPin</string>
            <key>CFBundleVersion</key>
            <string>$VERSION</string>
            <key>CFBundleShortVersionString</key>
            <string>$VERSION</string>
            <key>LSMinimumSystemVersion</key>
            <string>14.0</string>
            <key>LSUIElement</key>
            <true/>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
          </dict>
          </plist>
          PLIST
          codesign --force --deep -s - dist/TaskPin.app
          cat > dist/install.command << 'SCRIPT'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          APP_PATH="$DIR/TaskPin.app"
          DEST="/Applications/TaskPin.app"
          echo "Installing TaskPin..."
          if [ -d "$DEST" ]; then
            rm -rf "$DEST"
          fi
          cp -R "$APP_PATH" "$DEST"
          xattr -cr "$DEST"
          echo "TaskPin installed to /Applications"
          open "$DEST"
          echo "Done! You can close this window."
          SCRIPT
          chmod +x dist/install.command
          cd dist && zip -r ../TaskPin-macos.zip TaskPin.app examples install.command

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskpin-macos
          path: TaskPin-macos.zip

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2/MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make zip

      - name: Build
        run: make clean && make -j$(nproc) MODE=release

      - name: Package
        run: |
          mkdir -p dist
          cp taskpin.exe dist/
          cp taskpin.exe dist/taskpin-x64.exe
          cp -r examples dist/
          cp -r lang dist/
          # scripts/*.lua is gitignored, so the dir is absent on a fresh
          # checkout. Ship it empty — it's where market downloads land.
          mkdir -p dist/scripts
          cp -r scripts/. dist/scripts/ 2>/dev/null || true
          cd dist && zip -r ../TaskPin-windows.zip taskpin.exe examples lang scripts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskpin-windows
          path: |
            TaskPin-windows.zip
            dist/taskpin-x64.exe

  release:
    needs: [build-macos, build-windows]
    # Only publish for tag pushes. workflow_dispatch runs stop after the build
    # jobs, leaving artifacts for manual inspection — this keeps a manual run
    # from overwriting a live release with binaries built from a different commit.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches version.txt
        run: |
          VERSION=$(cat version.txt)
          if [ "${{ github.ref_name }}" != "v${VERSION}" ]; then
            echo "Tag ${{ github.ref_name }} does not match version.txt (v${VERSION})"
            exit 1
          fi

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: taskpin-macos
          path: artifacts/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: taskpin-windows
          path: artifacts/windows

      - name: Prepare release files
        run: |
          cp artifacts/macos/TaskPin-macos.zip .
          cp artifacts/windows/TaskPin-windows.zip .
          cp artifacts/windows/dist/taskpin-x64.exe .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            TaskPin-macos.zip
            TaskPin-windows.zip
            taskpin-x64.exe
          generate_release_notes: true
